name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Lint with Ruff
        run: |
          ruff check .

      - name: Run Unit Tests
        env:
          OPENROUTER_API_KEY: mock-key-for-ci
          QDRANT_URL: https://mock-cluster.cloud.qdrant.io
          QDRANT_API_KEY: mock-qdrant-key-for-ci
          INGESTION_API_KEY: mock-ingestion-key-for-ci
        run: |
          pytest -v tests/

